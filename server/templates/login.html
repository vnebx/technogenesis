<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technogenesis - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.75rem;
            letter-spacing: 0.05em;
        }
        .panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 0.65rem;
            background: #1f6feb;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #388bfd; }
        .error {
            background: #3d1214;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .switch {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: #8b949e;
        }
        .switch a {
            color: #58a6ff;
            text-decoration: none;
        }
        .switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Technogenesis</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="panel">
            <form method="POST" action="/login">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">

                <button type="submit">Sign In</button>
            </form>
        </div>

        <p class="switch">No account? <a href="/register">Register</a></p>
    </div>
</body>
</html>
