<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technogenesis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Silkscreen', monospace;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
            letter-spacing: 0.05em;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 1.25rem;
        }
        .panel {
            background: #161b22;
            border: 3px solid #8b949e;
            border-radius: 0;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.6);
            padding: 1.5rem;
            display: grid;
            gap: 1.5rem;
        }
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            padding: 0.7rem;
            border-radius: 0;
            border: 3px solid #79c0ff;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
            background: #1f6feb;
            color: #fff;
            font-size: 0.9rem;
            font-family: 'Silkscreen', monospace;
            cursor: pointer;
        }
        .btn:hover { background: #388bfd; }
        .btn-primary { border-color: #3fb950; background: #238636; }
        .btn-primary:hover { background: #2ea043; }
        .account {
            text-align: center;
            font-size: 0.75rem;
            color: #8b949e;
            line-height: 1.8;
        }
        .account a {
            color: #58a6ff;
            text-decoration: none;
        }
        .account a:hover { text-decoration: underline; }
        .muted { color: #484f58; }
        .login-stat { margin-top: 0.5rem;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Technogenesis</h1>

        <div class="panel">
            <a class="btn btn-primary" href="/singleplayer">Singleplayer</a>

            <a class="btn" href="/multiplayer">Multiplayer</a>
        </div>

        <div class="account">
            {% if logged_in %}
                <p class="login-stat">Logged in as <strong>{{ username }}</strong> &middot; <a href="/logout">Log out</a></p>
            {% else %}
                <p><a href="/login">Log in</a> &middot; <a href="/register">Register</a></p>
            {% endif %}
        </div>
    </div>
</body>
</html>
